# Gate: every submission must validate as untrusted input before it can merge.
validate:
  image: python:3
  script:
    - python3 scripts/validate-submission.py submissions/*.dat
    - python3 scripts/validate-submission.py --json submissions/*.dat > /dev/null
    - python3 scripts/merge-submissions.py vnovel.dat submissions/*.dat -o /tmp/merged.dat
    - python3 scripts/make-rdb.py /tmp/merged.dat /tmp/merged.rdb
